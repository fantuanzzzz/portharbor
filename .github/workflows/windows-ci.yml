name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore pure core tests
        run: dotnet restore tests/PortHarbor.UnitTests/PortHarbor.UnitTests.csproj --configfile NuGet.Config --locked-mode
      - name: Run pure core tests
        run: dotnet test tests/PortHarbor.UnitTests/PortHarbor.UnitTests.csproj -c Release --no-restore --logger "trx;LogFileName=core.trx" --results-directory artifacts/standard --collect "XPlat Code Coverage" --settings tests/coverage.runsettings
      - name: Upload core reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.os }}-reports
          path: artifacts/standard
          if-no-files-found: ignore

  validate:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - name: Install loopback fixture dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Restore standard tests
        run: dotnet restore tests/PortHarbor.UnitTests/PortHarbor.UnitTests.csproj --configfile NuGet.Config --locked-mode
      - name: Standard core tests and coverage
        run: dotnet test tests/PortHarbor.UnitTests/PortHarbor.UnitTests.csproj -c Release --no-restore --logger "trx;LogFileName=core.trx" --results-directory artifacts/standard --collect "XPlat Code Coverage" --settings tests/coverage.runsettings
      - name: Restore application checks
        run: dotnet restore tests/PortHarbor.Application.Checks/PortHarbor.Application.Checks.csproj --configfile NuGet.Config --locked-mode
      - name: Build application checks
        run: dotnet build tests/PortHarbor.Application.Checks/PortHarbor.Application.Checks.csproj -c Release --no-restore
      - name: Platform independent application checks
        run: dotnet run --project tests/PortHarbor.Application.Checks -c Release --no-build -- --results artifacts/application-results.json
      - name: Restore locked dependencies
        run: dotnet restore tests/PortHarbor.Checks/PortHarbor.Checks.csproj --runtime win-x64 --configfile NuGet.Config --locked-mode
      - name: Check diff whitespace
        run: git diff --check
      - name: Check changed C# formatting
        shell: pwsh
        env:
          STYLE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          $base = $env:STYLE_BASE
          if (-not $base -or $base -match '^0+$') {
            git rev-parse --verify 'HEAD^' 2>$null
            $base = if ($LASTEXITCODE -eq 0) { 'HEAD^' } else { '4b825dc642cb6eb9a060e54bf8d69288fbee4904' }
          }
          ./scripts/Check-CodeStyle.ps1 -BaseRevision $base
      - name: Publication rollback fault injection
        run: .\tests\build-rollback.ps1 -OutputDirectory artifacts\rollback-validation
      - name: Shortcut target inspection regression
        run: .\tests\shortcut-inspection.ps1 -OutputDirectory artifacts\shortcut-validation
      - name: Build Release
        run: dotnet build tests/PortHarbor.Checks/PortHarbor.Checks.csproj -c Release --no-restore
      - name: Fast core checks
        run: dotnet run --project tests/PortHarbor.Checks -c Release --no-build -- --unit --results artifacts/unit-results.json
      - name: Windows shell and lifecycle checks
        run: dotnet run --project tests/PortHarbor.Checks -c Release --no-build -- --windows --results artifacts/windows-results.json
      - name: Protocol loopback checks
        shell: pwsh
        run: |
          $fixtureRoot = Join-Path $env:RUNNER_TEMP 'portharbor-protocol-fixture'
          $serversPath = Join-Path $fixtureRoot 'servers.json'
          $stdout = Join-Path $env:RUNNER_TEMP 'portharbor-fixture-out.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'portharbor-fixture-error.log'
          $fixture = Start-Process -FilePath python -ArgumentList @('tests/protocol_servers.py', '--root', $fixtureRoot) -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            for ($i = 0; $i -lt 60 -and -not (Test-Path $serversPath); $i++) {
              if ($fixture.HasExited) { throw "Protocol fixture exited early: $(Get-Content $stderr -Raw)" }
              Start-Sleep -Seconds 1
            }
            if (-not (Test-Path $serversPath)) { throw "Protocol fixture did not become ready: $(Get-Content $stderr -Raw)" }
            dotnet run --project tests/PortHarbor.Checks -c Release --no-build -- --integration $serversPath --results artifacts/integration-results.json
            if ($LASTEXITCODE -ne 0) { throw 'Protocol integration checks failed' }
          }
          finally {
            if (-not $fixture.HasExited) { Stop-Process -Id $fixture.Id -Force }
          }
      - name: UI and terminal rendering smoke
        shell: pwsh
        run: |
          $screenshot = Join-Path $env:RUNNER_TEMP 'portharbor-ui.png'
          $terminalOutput = Join-Path $env:RUNNER_TEMP 'portharbor-ui-terminal.txt'
          dotnet run --project tests/PortHarbor.Checks -c Release --no-build -- --ui $screenshot
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $screenshot)) { throw 'UI rendering smoke failed' }
          dotnet run --project tests/PortHarbor.Checks -c Release --no-build -- --ui-shell $terminalOutput
          if ($LASTEXITCODE -ne 0 -or -not (Select-String -Path $terminalOutput -Pattern 'CONPTY_OK' -Quiet)) { throw 'UI terminal smoke failed' }
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ci-reports
          path: |
            artifacts/*-results.json
            artifacts/standard/**/*.trx
            artifacts/standard/**/coverage.cobertura.xml
            artifacts/shortcut-validation/**/shortcut-results.json
            ${{ runner.temp }}/portharbor-ui.png
            ${{ runner.temp }}/portharbor-ui-terminal.txt
          if-no-files-found: ignore

  distribution:
    needs: [core, validate]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Obtain verified Inno Setup compiler
        shell: pwsh
        run: ./packaging/Get-InnoSetup.ps1 -Download
      - name: Build and validate isolated distribution
        shell: pwsh
        run: ./build.ps1 -P10
      - name: Summarize distribution validation failure
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem artifacts/distribution-validation -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -in @('distribution-results.json', 'shortcut-details.json') } |
            ForEach-Object { Write-Host $_.Name; Get-Content -LiteralPath $_.FullName -Raw }
      - name: Upload distribution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distribution-evidence
          path: |
            artifacts/releases/release-manifest.json
            artifacts/distribution-validation/**/distribution-results.json
            artifacts/distribution-validation/**/shortcut-details.json
            artifacts/distribution-validation/**/*.log
          if-no-files-found: ignore
